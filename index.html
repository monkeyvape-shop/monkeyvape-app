<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; background: #121212; color: white; }
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; display: flex; align-items: center; justify-content: center; }
        #progress { height: 4px; width: 0%; background: #00FF00; transition: 0.3s; width: 80%; }
        .tab-content { display: none; padding: 20px; }
        .active { display: block; }
        nav { display: flex; justify-content: space-around; background: #222; padding: 15px 5px; position: sticky; top: 0; }
        nav button { background: none; border: none; color: white; cursor: pointer; font-size: 14px; }
        .profile-btn { background: #00FF00; color: #000; padding: 12px; text-decoration: none; display: inline-block; margin-top: 20px; font-weight: bold; border-radius: 8px; }
    </style>
</head>
<body>
    <!-- Полоска загрузки без лишнего текста -->
    <div id="loader"><div id="progress"></div></div>

    <!-- 4 вкладки -->
    <nav>
        <button onclick="showTab('catalog')">📦 Каталог</button>
        <button onclick="showTab('cart')">🛒 Корзина</button>
        <button onclick="showTab('orders')">📋 Заказы</button>
        <button onclick="showTab('profile')">👤 Профиль</button>
    </nav>

    <div id="catalog" class="tab-content active"><h1>Каталог</h1><p>Ассортимент товаров...</p></div>
    <div id="cart" class="tab-content"><h1>Корзина</h1><p>Ваши товары...</p></div>
    <div id="orders" class="tab-content"><h1>Ваши заказы</h1><p>История покупок...</p></div>
    
    <!-- Вкладка Профиль -->
    <div id="profile" class="tab-content">
        <h1>Профиль</h1>
        <div id="user-info"></div>
        <a href="https://t.me/warat_24" class="profile-btn">Связаться с менеджером</a>
    </div>

    <script>
        Telegram.WebApp.ready();
        
        // Анимация полоски загрузки
        const progress = document.getElementById('progress');
        progress.style.width = '100%';
        setTimeout(() => document.getElementById('loader').style.display = 'none', 600);

        // Получение данных пользователя из Telegram
        const user = Telegram.WebApp.initDataUnsafe.user;
        if(user) {
            document.getElementById('user-info').innerHTML = `
                <p>Имя: ${user.first_name}</p>
                <p>Username: @${user.username || 'не установлен'}</p>
                <p>ID: ${user.id}</p>
            `;
        }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }
    </script>
</body>
</html>
