<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Vape Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --card-bg: #16161c;
            --accent: #00ff66;
            --accent-hover: #00cc52;
            --text-color: #ffffff;
            --text-muted: #8c8c9e;
            --danger: #ff3333;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 75px;
        }
        /* Экран загрузки с логотипом и обезьянкой */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        .loader-logo {
            font-size: 48px; margin-bottom: 10px;
            animation: bounce 1s infinite alternate;
        }
        .loader-title {
            font-size: 20px; font-weight: bold; color: var(--accent);
            text-shadow: 0 0 10px rgba(0,255,102,0.4); margin-bottom: 25px;
            letter-spacing: 1px;
        }
        .spinner {
            width: 45px; height: 45px; border: 4px solid rgba(0,255,102,0.1);
            border-top: 4px solid var(--accent); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }
        
        /* Навигация с бейджем корзины */
        nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: #121218; border-top: 1px solid #22222f;
            display: flex; justify-content: space-around; padding: 10px 0; z-index: 100;
        }
        nav button {
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; font-size: 11px; display: flex; flex-direction: column;
            align-items: center; gap: 4px; transition: color 0.2s; position: relative;
        }
        nav button span { font-size: 18px; }
        nav button.active { color: var(--accent); }
        
        .badge {
            position: absolute; top: -2px; right: 8px; background: var(--danger);
            color: white; font-size: 10px; font-weight: bold; padding: 1px 5px;
            border-radius: 10px; display: none;
        }

        .tab-content { display: none; padding: 16px; }
        .tab-content.active { display: block; }

        h1 { font-size: 22px; margin-bottom: 16px; color: var(--text-color); }

        /* Каталог товаров */
        .products-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
        }
        .product-card {
            background: var(--card-bg); border-radius: 12px; padding: 12px;
            display: flex; flex-direction: column; justify-content: space-between;
            border: 1px solid #22222f;
        }
        .product-card img {
            width: 100%; height: 110px; object-fit: cover; border-radius: 8px; background: #262633;
        }
        .product-title { font-size: 13px; font-weight: 600; margin: 8px 0 4px; }
        .product-price { font-size: 14px; color: var(--accent); font-weight: bold; margin-bottom: 8px; }
        .btn {
            background: var(--accent); color: #000; border: none;
            padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer;
            font-size: 12px; width: 100%; transition: background 0.2s;
        }
        .btn:active { background: var(--accent-hover); }

        /* Корзина */
        .cart-item {
            background: var(--card-bg); padding: 10px 12px; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
            border: 1px solid #22222f;
        }
        .cart-total { font-size: 18px; font-weight: bold; margin: 16px 0; color: var(--accent); }

        /* Заказы */
        .order-card {
            background: var(--card-bg); border-radius: 10px; padding: 12px; margin-bottom: 10px;
            border: 1px solid #22222f; font-size: 13px;
        }

        /* Профиль */
        .profile-card {
            background: var(--card-bg); border-radius: 16px; padding: 20px;
            text-align: center; border: 1px solid #22222f;
        }
        .avatar {
            width: 80px; height: 80px; border-radius: 50%; background: #262633;
            margin: 0 auto 12px; display: flex; align-items: center; justify-content: center;
            font-size: 32px; color: var(--accent); border: 2px solid var(--accent);
            overflow: hidden;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-name { font-size: 18px; font-weight: bold; margin-bottom: 4px; }
        .profile-username { color: var(--text-muted); font-size: 14px; margin-bottom: 12px; }
        .profile-id { font-size: 12px; background: #121218; padding: 4px 10px; border-radius: 6px; display: inline-block; color: var(--text-muted); margin-bottom: 20px; }
        
        .manager-btn {
            background: var(--accent); color: #000; text-decoration: none;
            display: block; padding: 12px; border-radius: 8px; font-weight: bold;
            font-size: 14px; transition: background 0.2s;
        }
    </style>
</head>
<body>

    <!-- Увеличенный экран загрузки с логотипом и обезьянкой -->
    <div id="loader">
        <div class="loader-logo">🐵</div>
        <div class="loader-title">Monkey Vape Shop</div>
        <div class="spinner"></div>
    </div>

    <!-- Вкладка: Каталог -->
    <div id="catalog" class="tab-content active">
        <h1>Каталог товаров</h1>
        <div class="products-grid">
            <div class="product-card">
                <div>
                    <img src="https://images.unsplash.com/photo-1527661591475-527312dd65f5?w=300" alt="Vape">
                    <div class="product-title">HQD Cuvie (Подик)</div>
                    <div class="product-price">650 ₽</div>
                </div>
                <button class="btn" onclick="addToCart('HQD Cuvie (Подик)', 650)">В корзину</button>
            </div>
            <div class="product-card">
                <div>
                    <img src="https://images.unsplash.com/photo-1539185441755-769473a23570?w=300" alt="Liquid">
                    <div class="product-title">Жидкость Husky 30мл</div>
                    <div class="product-price">450 ₽</div>
                </div>
                <button class="btn" onclick="addToCart('Жидкость Husky 30мл', 450)">В корзину</button>
            </div>
            <div class="product-card">
                <div>
                    <img src="https://images.unsplash.com/photo-1512496015851-a90fb38ba796?w=300" alt="Cartridge">
                    <div class="product-title">Картридж XROS 0.8Ω</div>
                    <div class="product-price">300 ₽</div>
                </div>
                <button class="btn" onclick="addToCart('Картридж XROS 0.8Ω', 300)">В корзину</button>
            </div>
            <div class="product-card">
                <div>
                    <img src="https://images.unsplash.com/photo-1541643600914-78b084683601?w=300" alt="Vape Pod">
                    <div class="product-title">Vaporesso XROS 3</div>
                    <div class="product-price">2400 ₽</div>
                </div>
                <button class="btn" onclick="addToCart('Vaporesso XROS 3', 2400)">В корзину</button>
            </div>
        </div>
    </div>

    <!-- Вкладка: Корзина -->
    <div id="cart" class="tab-content">
        <h1>Корзина</h1>
        <div id="cart-items"><p style="color: var(--text-muted);">Корзина пуста</p></div>
        <div id="cart-summary" style="display: none;">
            <div class="cart-total">Итого: <span id="total-price">0</span> ₽</div>
            <button class="btn" style="padding: 12px; font-size: 15px;" onclick="checkout()">Оформить заказ</button>
        </div>
    </div>

    <!-- Вкладка: Заказы -->
    <div id="orders" class="tab-content">
        <h1>Ваши заказы</h1>
        <div id="orders-list">
            <p style="color: var(--text-muted);">У вас пока нет активных заказов.</p>
        </div>
    </div>

    <!-- Вкладка: Профиль -->
    <div id="profile" class="tab-content">
        <h1>Профиль</h1>
        <div class="profile-card">
            <div class="avatar" id="user-avatar">🐵</div>
            <div class="profile-name" id="user-fullname">Имя не определено</div>
            <div class="profile-username" id="user-username">@username</div>
            <div class="profile-id" id="user-id">ID: 0000000</div>
            <a href="https://t.me/warat_24" target="_blank" class="manager-btn">👨‍💻 Связаться с менеджером</a>
        </div>
    </div>

    <!-- Нижняя панель навигации -->
    <nav>
        <button onclick="showTab('catalog', this)" class="active"><span>📦</span>Каталог</button>
        <button onclick="showTab('cart', this)"><span>🛒</span>Корзина <span id="cart-badge" class="badge">0</span></button>
        <button onclick="showTab('orders', this)"><span>📋</span>Заказы</button>
        <button onclick="showTab('profile', this)"><span>👤</span>Профиль</button>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Увеличенное время лоадера для плавной неоновой заставки
        setTimeout(() => {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 500);
        }, 1200);

        // Инициализация профиля пользователя из Telegram
        const user = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
        if (user) {
            document.getElementById('user-fullname').innerText = `${user.first_name || ''} ${user.last_name || ''}`.trim() || 'Пользователь';
            document.getElementById('user-username').innerText = user.username ? `@${user.username}` : 'Без username';
            document.getElementById('user-id').innerText = `ID: ${user.id}`;
            if (user.photo_url) {
                document.getElementById('user-avatar').innerHTML = `<img src="${user.photo_url}" alt="Avatar">`;
            }
        }

        function showTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            if(btnElement) btnElement.classList.add('active');
            if(tabId === 'orders') renderOrders();
        }

        // Логика корзины
        let cart = [];

        function addToCart(name, price) {
            const existing = cart.find(item => item.name === name);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ name, price, qty: 1 });
            }
            updateCartUI();
            tg.HapticFeedback.notificationOccurred('success');
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const summary = document.getElementById('cart-summary');
            const badge = document.getElementById('cart-badge');
            
            let totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
            if (totalCount > 0) {
                badge.innerText = totalCount;
                badge.style.display = 'inline-block';
            } else {
                badge.style.display = 'none';
            }

            if (cart.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted);">Корзина пуста</p>';
                summary.style.display = 'none';
                return;
            }

            let html = '';
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price * item.qty;
                html += `
                    <div class="cart-item">
                        <div>
                            <div style="font-weight:600; font-size:13px;">${item.name}</div>
                            <div style="color:var(--text-muted); font-size:12px;">${item.price} ₽ x ${item.qty}</div>
                        </div>
                        <button onclick="removeFromCart(${index})" style="background:var(--danger); color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:11px;">Удалить</button>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('total-price').innerText = total;
            summary.style.display = 'block';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        // Заказы и сохранение истории
        function checkout() {
            let total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const orderData = {
                id: Math.floor(100000 + Math.random() * 900000),
                date: new Date().toLocaleDateString('ru-RU', { hour: '2-digit', minute: '2-digit' }),
                items: [...cart],
                total: total
            };

            // Сохраняем в историю заказов в localStorage
            let orders = JSON.parse(localStorage.getItem('monkey_orders') || '[]');
            orders.unshift(orderData);
            localStorage.setItem('monkey_orders', JSON.stringify(orders));

            // Отправка данных боту
            tg.sendData(JSON.stringify(orderData));

            // Очистка корзины
            cart = [];
            updateCartUI();
            
            tg.HapticFeedback.notificationOccurred('success');
            showTab('orders', document.querySelectorAll('nav button')[2]);
        }

        function renderOrders() {
            const container = document.getElementById('orders-list');
            let orders = JSON.parse(localStorage.getItem('monkey_orders') || '[]');
            
            if (orders.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted);">У вас пока нет оформленных заказов.</p>';
                return;
            }

            let html = '';
            orders.forEach(order => {
                let itemsStr = order.items.map(i => `${i.name} (x${i.qty})`).join(', ');
                html += `
                    <div class="order-card">
                        <div style="display:flex; justify-content:between; margin-bottom: 6px;">
                            <strong style="color:var(--accent);">Заказ #${order.id}</strong>
                            <span style="color:var(--text-muted); font-size:11px;">${order.date}</span>
                        </div>
                        <div style="margin-bottom: 6px; color:#ccc;">${itemsStr}</div>
                        <div style="font-weight:bold;">Итого: ${order.total} ₽</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }
    </script>
</body>
</html>
